<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#021c1b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Gloss overlay -->
  <rect x="12" y="12" width="488" height="240" rx="100" fill="url(#innerGlow)"/>

  <!-- Subtle concentric decorative ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Growth badge / ledger indicator -->
  <circle cx="360" cy="150" r="28" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <path d="M352 150 L358 144 L368 154" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bengali Taka Symbol ৳ in center -->
  <text x="256" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="285" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">৳</text>

  <!-- Bottom Accent bar -->
  <rect x="180" y="388" width="152" height="12" rx="6" fill="#34d399" filter="url(#shadow)"/>
</svg>